[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
  ".venv",
  "**/.venv",
  ".pytest_cache",
  ".ruff_cache",
  "**/__pycache__",
  "node_modules",
  "dist",
  "build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.format]
quote-style = "double"
indent-style = "space"